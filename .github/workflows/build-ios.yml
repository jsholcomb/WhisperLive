name: Build iOS IPA
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest'

      - name: Build and Package App
        run: |
          # 1. Drop directly into the project folder
          cd Audio-Transcription-iOS
          
          # 2. Compile the target without signing dependencies
          xcodebuild build \
            -project Audio-Transcription-iOS.xcodeproj \
            -scheme Audio-Transcription-iOS \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

          # 3. Create the standard IPA structural envelope
          mkdir -p Payload
          cp -r ~/Library/Developer/Xcode/DerivedData/*/Build/Products/Release-iphoneos/Audio-Transcription-iOS.app Payload/
          zip -r ../WhisperLive.ipa Payload

      - name: Upload Finished IPA
        uses: actions/upload-artifact@v4
        with:
          name: WhisperLive-Unsigned-IPA
          path: WhisperLive.ipa
